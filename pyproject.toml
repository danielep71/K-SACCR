# Quality settings for the repository's Python tooling (tools/).
# Adapted from EXCEL-VBA-PROJECT-TEMPLATE b903fe44. The tooling itself needs only
# the standard library; Ruff and mypy are CI and development tools.

[tool.ruff]
target-version = "py310"
# Formatting target only: E501 is not selected and CI does not run ruff format.
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I001", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
# Vendored from VBA-DATETIMEPICKER (#60) and kept close to upstream so it can be
# resynchronised; three of its parser functions exceed the ceiling. Advisory only.
"tools/check_vba_calls.py" = ["C901"]

[tool.mypy]
python_version = "3.10"
files = ["tools"]
pretty = true
show_error_codes = true
warn_unused_configs = true
# Every module, tests included, is held to the full strict bundle.
strict = true
