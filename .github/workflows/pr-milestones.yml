# Keeps milestones on issues only. Pull requests are never given a milestone:
# the reconcile job removes one when a pull request is opened, reopened,
# edited or given a milestone, and the daily run clears any that remain. It
# runs trusted inline code only, with no checkout and pull-requests: write in
# its job alone. Adapted under the MIT License; see
# docs/licenses/THIRD_PARTY_NOTICES.md.

name: Keep milestones issue-only

on:
  push:
    branches: [main]
    paths: [.github/workflows/pr-milestones.yml]
  pull_request_target:
    types: [opened, reopened, edited, milestoned]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pr-milestones
  cancel-in-progress: false

jobs:
  reconcile:
    name: Remove PR milestone assignments
    # Manual dispatch and the path-filtered push can select any branch's copy
    # of this workflow; only pull_request_target, the schedule and the default
    # branch run the reviewed copy.
    if: >-
      github.event_name == 'pull_request_target' ||
      github.event_name == 'schedule' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pull-requests: write
    steps:
      # Trusted inline code only: never check out or execute a PR's contents.
      - name: Reconcile PR metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen

          def reconcile(request, repository, event):
              def clear(number):
                  # Verify the live object before mutating the issues endpoint.
                  item = request("GET", f"/repos/{repository}/issues/{number}")
                  if "pull_request" not in item:
                      raise ValueError("Refusing to change an issue")
                  if item.get("milestone") is not None:
                      result = request("PATCH", f"/repos/{repository}/issues/{number}", {"milestone": None})
                      if result.get("milestone") is not None:
                          raise ValueError(f"PR #{number} still has a milestone")
                      print(f"Removed milestone from PR #{number}")

              if "pull_request" in event:
                  clear(int(event["number"]))
                  return
              # Traverse the full unfiltered PR collection so mutations cannot
              # shift pagination. This includes closed and merged PRs and bots.
              for page in range(1, 101):
                  items = request("GET", f"/repos/{repository}/pulls?state=all&sort=created&direction=asc&per_page=100&page={page}")
                  if not isinstance(items, list):
                      raise ValueError("Malformed PR collection")
                  for item in items:
                      if item.get("milestone") is not None:
                          clear(int(item["number"]))
                  if len(items) < 100:
                      print("PR milestone reconciliation complete")
                      return
              raise ValueError("PR pagination exceeded 100 pages")

          def main():
              repository = os.environ["GITHUB_REPOSITORY"]
              event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())

              def request(method, path, data=None):
                  headers = {
                      "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  }
                  payload = None if data is None else json.dumps(data).encode()
                  req = Request(os.environ["GITHUB_API_URL"] + path, data=payload, headers=headers, method=method)
                  with urlopen(req, timeout=30) as response:
                      return json.load(response)

              reconcile(request, repository, event)

          if __name__ == "__main__":
              main()
          PY
