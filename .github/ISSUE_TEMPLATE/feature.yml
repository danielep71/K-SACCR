name: "✨ Feature or calculation change"
description: "Propose new behavior, a calculation change or a tooling improvement."
title: "[Feature]: "
labels: ["enhancement", "P2"]
assignees: ["danielep71"]
body:
  - type: markdown
    attributes:
      value: |
        ## ✨ Feature or calculation change

        **Outcome first · Cited rule · Verifiable acceptance · Explicit boundaries**

        Describe the result you need and how it will be proved, before any implementation. A calculation change cites its regulatory source and states units and valid input domains. Triage sets the milestone and confirms the priority (default `P2`).

        > [!NOTE]
        > CRR is the baseline regime and Basel CRE52 is also supported; see [`docs/methodology/`](https://github.com/danielep71/VBA-SACCR-Toolkit/blob/main/docs/methodology/README.md). No real portfolio data.

  - type: dropdown
    id: area
    attributes:
      label: "🎚️ Area"
      options:
        - Calculation engine (src/core)
        - Public API (src/modules)
        - Workbook and user interface
        - Tests and fixtures
        - Tooling and CI
        - Documentation
        - Repository and governance
    validations:
      required: true

  - type: dropdown
    id: regime
    attributes:
      label: "⚖️ Regime"
      options:
        - CRR (baseline)
        - Basel CRE52 (BCBS)
        - Both
        - Not regime-specific
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: "🎯 Problem and user"
      description: What need is unmet, and for whom.
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: "🧩 Requested behavior"
      description: The observable result. For a calculation change, cite the source and locator (for example CRR Article 275(1)) and state units and valid input domains.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: "🏁 Acceptance criteria"
      placeholder: |
        - [ ] ...
        - [ ] Regression case with an independent expected value
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: "📐 Scope and non-goals"
      description: What is in and out of this change.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "🔀 Alternatives considered"
      description: Existing workarounds or smaller designs, and why they are not enough. Write "None" if there are none.
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: "🔗 Dependencies"
      description: Issues or decisions this depends on. Write "None" if there are none.
    validations:
      required: true

  - type: textarea
    id: compatibility
    attributes:
      label: "💥 Compatibility impact"
      description: Effect on the public API (docs/PUBLIC_API.txt), computed results, input or output layouts and supported hosts. Write "None" if there is none.
    validations:
      required: true

  - type: textarea
    id: validation
    attributes:
      label: "✅ Validation evidence required"
      description: Static checks, Excel compile, harness, the specific scenario and, for a calculation, the independent reference and tolerance.
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: "☑️ Submission checks"
      options:
        - label: I searched open and closed issues for an equivalent proposal.
          required: true
        - label: I separated the required behavior from implementation preferences.
          required: true
        - label: This proposal contains no real portfolio data and no secrets or private links.
          required: true
